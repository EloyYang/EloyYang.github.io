<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — Eloy Lab</title>
<link rel="stylesheet" href="/style.css">
<script>
  // 예전 시험 사이트 주소(/css, /js, /fire/... 등)는 /exam/ 아래로 보낸다
  (function () {
    var p = location.pathname;
    if (/^\/(css|js|fire|gtelp|history|img|data)\//.test(p) || /^\/[a-z_-]+\.(html|png|svg|json)$/.test(p))
      location.replace('/exam' + p + location.search + location.hash);
  })();
</script>
</head><body><main style="padding:96px 24px;text-align:center">
<h1 style="font-size:28px">페이지를 찾을 수 없습니다</h1>
<p style="color:var(--muted)">주소가 바뀌었거나 없는 페이지입니다.</p>
<p><a class="btn" href="/">Eloy Lab 처음으로</a></p>
</main></body></html>
